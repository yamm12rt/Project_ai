<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Открой Оренбуржье</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">Открой Оренбуржье</a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="catalog.html" class="nav__link">Каталог мест</a>
      </nav>
      <div class="header__actions">
        <a href="register.html" class="btn btn--primary btn--sm">Регистрация</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="auth-wrapper">
      <h1 style="margin-bottom: 8px;">Вход в систему</h1>
      <p class="card__meta" style="margin-bottom: 20px;">
        Авторизуйтесь, чтобы добавлять достопримечательности и загружать фотографии.
      </p>

      <form action="profile.html" method="get">
        <div class="form-group">
          <label class="form-label" for="email">Электронная почта</label>
          <input class="form-control" type="email" id="email" name="email" placeholder="tourist@oren.ru" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Пароль</label>
          <input class="form-control" type="password" id="password" name="password" placeholder="Введите пароль" required>
        </div>

        <button type="submit" class="btn btn--primary" style="width: 100%;">Войти в кабинет</button>
      </form>

      <p class="card__meta" style="margin-top: 16px; text-align: center;">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
      </p>
    </section>
  </main>
</body>
</html>
